import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Version tirée de package.json (source unique). Play exige un versionCode
// strictement croissant : major*10000 + minor*100 + patch, d'où minor/patch ≤ 99.
def appVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version as String
def versionParts = appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!versionParts.matches()) {
    throw new GradleException("package.json : version \"${appVersion}\" invalide, format X.Y.Z attendu (ex. 1.2.3).")
}
def (major, minor, patch) = (1..3).collect { versionParts.group(it) as int }
if (minor > 99 || patch > 99) {
    throw new GradleException("package.json : version ${appVersion} invalide, minor et patch doivent rester ≤ 99 (versionCode = major*10000 + minor*100 + patch).")
}
def appVersionCode = major * 10000 + minor * 100 + patch
if (appVersionCode < 1) {
    throw new GradleException("package.json : version ${appVersion} invalide, Android exige un versionCode ≥ 1.")
}

// Signature release : android/keystore.properties (hors Git, format dans
// keystore.properties.example). Absent, le release sort non signé sans bloquer le debug.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    def missingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !keystoreProperties[it] }
    if (missingKeys) {
        throw new GradleException("${keystorePropertiesFile} : clé(s) manquante(s) ${missingKeys.join(', ')}, voir keystore.properties.example.")
    }
} else {
    logger.warn("AVERTISSEMENT : ${keystorePropertiesFile} introuvable, le build release (bundleRelease/assembleRelease) sera NON SIGNÉ et refusé par Google Play. Voir keystore.properties.example.")
}

android {
    namespace = "com.hibol.minesweeper"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hibol.minesweeper"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                // « ~ » n'est pas développé par Gradle ; un chemin relatif part de android/.
                storeFile rootProject.file(keystoreProperties.storeFile.replaceFirst(/^~(?=\/|$)/, System.getProperty('user.home')))
                storePassword keystoreProperties.storePassword
                keyAlias keystoreProperties.keyAlias
                keyPassword keystoreProperties.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
