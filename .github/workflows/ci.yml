name: CI

# Lint, formatage et tests sur chaque push et chaque pull request.
# Aussi appelé par deploy.yml (workflow_call) : sur main, c'est lui qui
# lance la CI avant de publier, d'où l'exclusion de main ci-dessous.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vitest 5 / Vite 8 exigent Node >= 22 (idem .nvmrc et deploy.yml).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
