name: CI

# Lint/tests sur chaque push et chaque pull request. deploy.yml reste
# inchangé (build + publication Pages sur push main uniquement).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vitest 5 / Vite 8 exigent Node >= 22 (idem .nvmrc et deploy.yml).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
